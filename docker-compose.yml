version: '3.8'
services:
  backend:
    build: 
      context: ./backend
      # O Dockerfile da pasta backend deve copiar os requirements padrão
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Monta todos os arquivos python da raiz (vrp_domain, vrp_genetic, etc) dentro do contêiner
      - ./:/app
    environment:
      - PYTHONPATH=/app
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: 
      context: ./frontend
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address 0.0.0.0
    depends_on:
      - backend